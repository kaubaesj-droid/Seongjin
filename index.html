<html lang="ko">

<title>세인영 OTT 공유 현황</title>

<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    
    /* Minimalist Light Palette */
    --bg: #f8f9fa;
    --surface: #ffffff;
    --surface-sub: #f1f3f5;
    --ink: #111827;
    --muted: #6b7280;
    --subtle: #9ca3af;
    --line: #e5e7eb;
    
    --free: #10b981;
    --free-bg: #ecfdf5;
    --busy: #f43f5e;
    --busy-bg: #fff1f2;
    --accent: #111827;
    --accent-ink: #ffffff;
    
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    --overlay: rgba(17, 24, 39, 0.4);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-sub: #222634;
      --ink: #f9fafb;
      --muted: #9ca3af;
      --subtle: #6b7280;
      --line: #2a2f3d;
      
      --free: #34d399;
      --free-bg: rgba(52, 211, 153, 0.12);
      --busy: #fb7185;
      --busy-bg: rgba(251, 113, 133, 0.12);
      --accent: #f9fafb;
      --accent-ink: #0f1117;
      
      --shadow-sm: none;
      --shadow-md: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      --overlay: rgba(0, 0, 0, 0.7);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #181b24;
    --surface-sub: #222634;
    --ink: #f9fafb;
    --muted: #9ca3af;
    --subtle: #6b7280;
    --line: #2a2f3d;
    
    --free: #34d399;
    --free-bg: rgba(52, 211, 153, 0.12);
    --busy: #fb7185;
    --busy-bg: rgba(251, 113, 133, 0.12);
    --accent: #f9fafb;
    --accent-ink: #0f1117;
    
    --shadow-sm: none;
    --shadow-md: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    --overlay: rgba(0, 0, 0, 0.7);
  }

    --bg: #f8f9fa;
    --surface: #ffffff;
    --surface-sub: #f1f3f5;
    --ink: #111827;
    --muted: #6b7280;
    --subtle: #9ca3af;
    --line: #e5e7eb;
    
    --free: #10b981;
    --free-bg: #ecfdf5;
    --busy: #f43f5e;
    --busy-bg: #fff1f2;
    --accent: #111827;
    --accent-ink: #ffffff;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    --overlay: rgba(17, 24, 39, 0.4);
  }
